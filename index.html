<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КМТ - Дежурные</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
  }
  h1 {
    font-size: 1.8em;
    color: #f0b90b;
    margin-bottom: 20px;
    text-align: center;
  }
  .battle-arena {
    display: flex;
    gap: 15px;
    width: 100%;
    max-width: 1200px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .player-side {
    flex: 1;
    min-width: 280px;
    background: #131b2e;
    border: 1px solid #24304a;
    border-radius: 12px;
    padding: 15px;
  }
  .player-title {
    text-align: center;
    color: #8ba3d0;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .player-title.p1 { color: #4d9be6; }
  .player-title.p2 { color: #f0b90b; }
  .roulette-wrap {
    width: 100%;
    position: relative;
  }
  .marker {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid #f0b90b;
    z-index: 10;
  }
  .roulette {
    display: flex;
    background: #060a12;
    border: 2px solid #24304a;
    border-radius: 8px;
    overflow: hidden;
    height: 130px;
    position: relative;
  }
  .roulette-inner {
    display: flex;
    transition: transform 6s cubic-bezier(0.08, 0.75, 0.15, 1);
  }
  .item {
    flex: 0 0 130px;
    height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    font-size: 0.75em;
    border-right: 1px solid #000;
  }
  .item .name { margin-top: 6px; font-weight: 600; }
  .item .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #000;
    font-size: 1.1em;
  }
  .rar-common { background: linear-gradient(180deg, #1a2338, #0d1522); color: #8a99b8; }
  .rar-common .avatar { background: #b0b6c3; }
  .rar-uncommon { background: linear-gradient(180deg, #122b45, #0a1a2c); color: #4d9be6; }
  .rar-uncommon .avatar { background: #4d9be6; }
  .rar-rare { background: linear-gradient(180deg, #221440, #120a24); color: #8855ff; }
  .rar-rare .avatar { background: #8855ff; }
  .rar-epic { background: linear-gradient(180deg, #3d1230, #21091a); color: #e64db8; }
  .rar-epic .avatar { background: #e64db8; }
  .rar-legendary { background: linear-gradient(180deg, #4a3510, #241808); color: #f0b90b; }
  .rar-legendary .avatar { background: #f0b90b; }

  .result-box {
    min-height: 50px;
    text-align: center;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .result-box.show { opacity: 1; }
  .result-box .highlight { font-size: 1.2em; font-weight: 800; display: block; margin-top: 3px; }
  .result-box .rarity-label { font-size: 0.7em; text-transform: uppercase; opacity: 0.8; }

  .controls {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 16px 34px;
    font-size: 1em;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #spinBtn {
    background: linear-gradient(180deg, #f0b90b, #b8860b);
    color: #1a1408;
    box-shadow: 0 4px 0 #7a5a07;
  }
  #spinBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #resetBtn {
    background: #2a3550;
    color: #8ba3d0;
  }
  .battle-result {
    margin-top: 20px;
    font-size: 1.6em;
    font-weight: 900;
    color: #f0b90b;
    text-align: center;
    min-height: 50px;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .battle-result.show { opacity: 1; }
  .stats {
    margin-top: 25px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    color: #5a6b8c;
    background: #131b2e;
    padding: 12px 25px;
    border-radius: 10px;
    border: 1px solid #24304a;
  }
  .stats span { color: #f0b90b; font-weight: 700; }
  @media (max-width: 768px) {
    .item { flex: 0 0 105px; height: 110px; font-size: 0.62em; }
    .roulette { height: 110px; }
    .item .avatar { width: 34px; height: 34px; font-size: 0.95em; }
    h1 { font-size: 1.4em; }
  }
</style>
</head>
<body>

<h1>КМТ - Дежурные</h1>

<div class="battle-arena">
  <div class="player-side">
    <div class="player-title p1">Игрок 1</div>
    <div class="roulette-wrap">
      <div class="marker"></div>
      <div class="roulette">
        <div class="roulette-inner" id="inner1"></div>
      </div>
    </div>
    <div class="result-box" id="result1"></div>
  </div>

  <div class="player-side">
    <div class="player-title p2">Игрок 2</div>
    <div class="roulette-wrap">
      <div class="marker"></div>
      <div class="roulette">
        <div class="roulette-inner" id="inner2"></div>
      </div>
    </div>
    <div class="result-box" id="result2"></div>
  </div>
</div>

<div class="battle-result" id="battleResult"></div>

<div class="controls">
  <button id="spinBtn">Открыть кейсы</button>
  <button id="resetBtn">Сброс</button>
</div>

<div class="stats">
  <div>Открытий: <span id="statOpens">0</span></div>
  <div>Побед И1: <span id="statW1">0</span></div>
  <div>Побед И2: <span id="statW2">0</span></div>
</div>

<script>
const PEOPLE = [
  { name: "Булин Александр",        rarity: "common",    weight: 30, value: 1 },
  { name: "Высоцкая Жанна",         rarity: "common",    weight: 30, value: 1 },
  { name: "Ганов Артем",            rarity: "common",    weight: 30, value: 1 },
  { name: "Данилов Данил",          rarity: "common",    weight: 30, value: 1 },
  { name: "Доровских Константин",   rarity: "common",    weight: 30, value: 1 },
  { name: "Зобнев Никита",          rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кабаков Илья",           rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Климачев Александр",     rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Колесников Александр",   rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кондратьев Николай",     rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кузнецов Виталий",       rarity: "rare",      weight: 12, value: 3 },
  { name: "Куксенко Никита",        rarity: "rare",      weight: 12, value: 3 },
  { name: "Мананникова Екатерина",  rarity: "rare",      weight: 12, value: 3 },
  { name: "Николенко Кирилл",       rarity: "rare",      weight: 12, value: 3 },
  { name: "Павленко Владислав",     rarity: "rare",      weight: 12, value: 3 },
  { name: "Путин Артём",            rarity: "epic",      weight: 6,  value: 4 },
  { name: "Попова Снежана",         rarity: "epic",      weight: 6,  value: 4 },
  { name: "Рогова Арина",           rarity: "epic",      weight: 6,  value: 4 },
  { name: "Рыбак Константин",       rarity: "epic",      weight: 6,  value: 4 },
  { name: "Списивцев Роман",        rarity: "epic",      weight: 6,  value: 4 },
  { name: "Терехов Денис",          rarity: "legendary", weight: 3,  value: 5 },
  { name: "Тетёркин Егор",          rarity: "legendary", weight: 3,  value: 5 },
  { name: "Шпаков Марк",            rarity: "legendary", weight: 3,  value: 5 },
  { name: "Щербинин Антон",         rarity: "legendary", weight: 3,  value: 5 },
];

const RARITY_LABEL = {
  common: "Обычный", uncommon: "Необычный", rare: "Редкий",
  epic: "Эпический", legendary: "Легендарный"
};
const COLOR_MAP = {
  common: "#8a99b8", uncommon: "#4d9be6", rare: "#8855ff",
  epic: "#e64db8", legendary: "#f0b90b"
};

function pickWeighted() {
  const total = PEOPLE.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of PEOPLE) {
    if (r < p.weight) return p;
    r -= p.weight;
  }
  return PEOPLE[0];
}

function initials(name) {
  const parts = name.split(" ");
  return (parts[0]?.[0] || "") + (parts[1]?.[0] || "");
}

function makeItem(person) {
  const el = document.createElement("div");
  el.className = `item rar-${person.rarity}`;
  el.innerHTML = `
    <div class="avatar">${initials(person.name)}</div>
    <div class="name">${person.name}</div>
  `;
  return el;
}

const inner1 = document.getElementById("inner1");
const inner2 = document.getElementById("inner2");
const spinBtn = document.getElementById("spinBtn");
const resetBtn = document.getElementById("resetBtn");
const result1 = document.getElementById("result1");
const result2 = document.getElementById("result2");
const battleResult = document.getElementById("battleResult");

let spinning = false;
let totalOpens = 0;
let wins1 = 0;
let wins2 = 0;

function getItemWidth() {
  return window.innerWidth <= 768 ? 105 : 130;
}

function buildStrip(innerEl, count) {
  innerEl.innerHTML = "";
  innerEl.style.transition = "none";
  innerEl.style.transform = "translateX(0)";
  for (let i = 0; i < count; i++) {
    innerEl.appendChild(makeItem(pickWeighted()));
  }
}

spinBtn.addEventListener("click", function() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;

  result1.classList.remove("show");
  result2.classList.remove("show");
  battleResult.classList.remove("show");
  result1.innerHTML = "";
  result2.innerHTML = "";
  battleResult.innerHTML = "";

  const winner1 = pickWeighted();
  const winner2 = pickWeighted();

  const STRIP_LEN = 60;
  const WIN_INDEX = 50;
  const ITEM_W = getItemWidth();

  buildStrip(inner1, STRIP_LEN);
  buildStrip(inner2, STRIP_LEN);

  const el1 = makeItem(winner1);
  inner1.children[WIN_INDEX].replaceWith(el1);

  const el2 = makeItem(winner2);
  inner2.children[WIN_INDEX].replaceWith(el2);

  function calcTarget(innerEl) {
    const containerW = innerEl.parentElement.clientWidth;
    const jitter = (Math.random() - 0.5) * (ITEM_W * 0.5);
    return -(WIN_INDEX * ITEM_W) + (containerW / 2) - (ITEM_W / 2) + jitter;
  }

  void inner1.offsetWidth;
  void inner2.offsetWidth;

  inner1.style.transition = "transform 6s cubic-bezier(0.08, 0.75, 0.15, 1)";
  inner1.style.transform = "translateX(" + calcTarget(inner1) + "px)";

  inner2.style.transition = "transform 6s cubic-bezier(0.08, 0.75, 0.15, 1)";
  inner2.style.transform = "translateX(" + calcTarget(inner2) + "px)";

  setTimeout(function() {
    spinning = false;
    spinBtn.disabled = false;

    totalOpens++;

    let battleText = "";
    if (winner1.value > winner2.value) {
      wins1++;
      battleText = "Победа Игрока 1!";
    } else if (winner2.value > winner1.value) {
      wins2++;
      battleText = "Победа Игрока 2!";
    } else {
      battleText = "Ничья!";
    }

    document.getElementById("statOpens").textContent = totalOpens;
    document.getElementById("statW1").textContent = wins1;
    document.getElementById("statW2").textContent = wins2;

    result1.innerHTML = '<div class="rarity-label" style="color:' + COLOR_MAP[winner1.rarity] + '">' + RARITY_LABEL[winner1.rarity] + '</div>' +
                        '<div class="highlight" style="color:' + COLOR_MAP[winner1.rarity] + '">' + winner1.name + '</div>';
    result1.classList.add("show");

    result2.innerHTML = '<div class="rarity-label" style="color:' + COLOR_MAP[winner2.rarity] + '">' + RARITY_LABEL[winner2.rarity] + '</div>' +
                        '<div class="highlight" style="color:' + COLOR_MAP[winner2.rarity] + '">' + winner2.name + '</div>';
    result2.classList.add("show");

    battleResult.textContent = battleText;
    battleResult.classList.add("show");
  }, 6100);
});

resetBtn.addEventListener("click", function() {
  if (spinning) return;
  buildStrip(inner1, 20);
  buildStrip(inner2, 20);
  result1.classList.remove("show");
  result2.classList.remove("show");
  battleResult.classList.remove("show");
});

buildStrip(inner1, 20);
buildStrip(inner2, 20);
</script>

</body>
</html>
