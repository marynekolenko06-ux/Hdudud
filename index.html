<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КМТ - Дежурные | Case Battle</title>
<style>
  :root {
    --item-w: 130px;
    --roulette-h: 140px;
    --gold: #f0b90b;
    --gold-dark: #b8860b;
    --blue: #1e6fff;
    --bg-dark: #0b1220;
    --bg-card: #131b2e;
    --border: #24304a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-dark);
    background-image:
      radial-gradient(ellipse at top, rgba(30, 111, 255, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at bottom, rgba(240, 185, 11, 0.08) 0%, transparent 50%),
      linear-gradient(180deg, #0a1018 0%, #0d1522 50%, #0a1018 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px 40px;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(30, 111, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 111, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  .header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-family: Georgia, serif;
    font-size: 2em;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffe082 0%, #f0b90b 50%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(240, 185, 11, 0.4);
    margin-bottom: 5px;
    animation: shine 3s infinite;
  }
  @keyframes shine {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  .subtitle { color: #5a6b8c; font-size: 0.85em; letter-spacing: 1px; }

  /* ===== КЕЙСЫ ===== */
  .cases-row {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin: 15px 0 25px;
    min-height: 130px;
    align-items: center;
  }
  .case {
    width: 110px;
    height: 110px;
    position: relative;
    transition: transform 0.3s;
  }
  .case-body {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 65%;
    background: linear-gradient(180deg, #2a3550 0%, #1a2338 100%);
    border: 2px solid var(--gold-dark);
    border-radius: 6px;
    box-shadow:
      inset 0 -8px 20px rgba(0,0,0,0.6),
      0 0 20px rgba(240, 185, 11, 0.3);
  }
  .case-body::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30px; height: 30px;
    background: radial-gradient(circle, #f0b90b 0%, #b8860b 100%);
    border-radius: 50%;
    box-shadow: 0 0 15px #f0b90b;
  }
  .case-body::after {
    content: '🔒';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    z-index: 2;
  }
  .case-lid {
    position: absolute;
    top: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(180deg, #3a4560 0%, #2a3550 100%);
    border: 2px solid var(--gold-dark);
    border-radius: 6px 6px 2px 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 4px 8px rgba(255,255,255,0.05);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s;
    transform-origin: top center;
    z-index: 3;
  }
  .case.opening .case-lid {
    transform: translateY(-80px) rotateX(-120deg);
    opacity: 0;
  }
  .case.shaking { animation: shake 0.15s infinite; }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    25% { transform: translate(-1px, 2px) rotate(-1deg); }
    50% { transform: translate(-2px, -1px) rotate(1deg); }
    75% { transform: translate(2px, 1px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .case-light {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    background: radial-gradient(circle, #fff 0%, #f0b90b 30%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  .case.opening .case-light {
    animation: lightBurst 1s ease-out forwards;
  }
  @keyframes lightBurst {
    0% { width: 0; height: 0; opacity: 0; }
    30% { width: 300px; height: 300px; opacity: 1; }
    100% { width: 400px; height: 400px; opacity: 0; }
  }

  /* ===== АРЕНА ===== */
  .battle-arena {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 15px;
    width: 100%;
    max-width: 1200px;
    margin-bottom: 20px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s, max-height 0.8s;
  }
  .battle-arena.active {
    opacity: 1;
    max-height: 1000px;
  }
  .player-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 0;
    background: linear-gradient(180deg, rgba(19, 27, 46, 0.9), rgba(11, 18, 32, 0.9));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .player-title {
    font-size: 1em;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 20px;
    background: linear-gradient(180deg, #2a3550, #1a2338);
    border: 1px solid var(--border);
  }
  .player-title.p1 { color: #4d9be6; border-color: #1e6fff; }
  .player-title.p2 { color: #f0b90b; border-color: #b8860b; }
  .vs-badge {
    font-family: Georgia, serif;
    font-size: 1.4em;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold-dark);
    background: rgba(240, 185, 11, 0.08);
    padding: 12px 16px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    align-self: center;
    animation: vsPulse 1.5s infinite alternate;
    box-shadow: 0 0 30px rgba(240, 185, 11, 0.4);
  }
  @keyframes vsPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); box-shadow: 0 0 50px rgba(240, 185, 11, 0.8); }
  }

  /* ===== РУЛЕТКА ===== */
  .roulette-wrap { width: 100%; position: relative; }
  .marker {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 22px solid var(--gold);
    z-index: 10;
    filter: drop-shadow(0 0 10px var(--gold));
  }
  .marker.pulse { animation: markerPulse 0.5s infinite alternate; }
  @keyframes markerPulse {
    0% { transform: translateX(-50%) scale(1); }
    100% { transform: translateX(-50%) scale(1.25); filter: drop-shadow(0 0 20px var(--gold)); }
  }
  .roulette {
    display: flex;
    background: #060a12;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    height: var(--roulette-h);
    position: relative;
    box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,0.6);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .roulette.spinning {
    border-color: var(--gold);
    box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 0 30px rgba(240, 185, 11, 0.4);
  }
  .roulette-inner {
    display: flex;
    transition: transform 6s cubic-bezier(0.08, 0.75, 0.15, 1);
    will-change: transform;
  }
  .item {
    flex: 0 0 var(--item-w);
    height: var(--roulette-h);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid rgba(0,0,0,0.6);
    padding: 8px;
    text-align: center;
    font-size: 0.75em;
    position: relative;
    background: linear-gradient(180deg, #1a2338 0%, #0d1522 100%);
  }
  .item::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: currentColor;
    opacity: 0.6;
  }
  .item .name { font-weight: 600; margin-top: 6px; line-height: 1.15; z-index: 2; letter-spacing: 0.3px; }
  .item .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15em;
    font-weight: 800;
    color: #000;
    z-index: 2;
    box-shadow: 0 0 15px currentColor;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .item.winner { z-index: 5; }

  .rar-common { color: #8a99b8; }
  .rar-common .avatar { background: linear-gradient(180deg, #b0b6c3, #8a91a0); }
  .rar-uncommon { color: #4d9be6; }
  .rar-uncommon .avatar { background: linear-gradient(180deg, #6bb5ff, #4d9be6); }
  .rar-rare { color: #8855ff; }
  .rar-rare .avatar { background: linear-gradient(180deg, #a578ff, #8855ff); }
  .rar-epic { color: #e64db8; }
  .rar-epic .avatar { background: linear-gradient(180deg, #ff7acc, #e64db8); }
  .rar-legendary { color: #f0b90b; }
  .rar-legendary .avatar { background: linear-gradient(180deg, #ffd66b, #f0b90b); animation: legendPulse 1.5s infinite alternate; }
  @keyframes legendPulse {
    0% { box-shadow: 0 0 15px #f0b90b; }
    100% { box-shadow: 0 0 35px #f0b90b, 0 0 60px #f0b90b; }
  }

  /* ===== РЕЗУЛЬТАТЫ ===== */
  .result-box {
    min-height: 55px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    width: 100%;
    padding: 8px;
    border-radius: 8px;
  }
  .result-box.show { opacity: 1; transform: translateY(0); }
  .result-box .highlight {
    font-size: 1.15em;
    font-weight: 800;
    display: block;
    text-shadow: 0 0 15px currentColor;
  }
  .result-box .rarity-label {
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 3px;
    opacity: 0.8;
  }
  .result-box.winning {
    background: rgba(240, 185, 11, 0.1);
    animation: winGlow 0.8s infinite alternate;
  }
  @keyframes winGlow {
    0% { box-shadow: 0 0 10px rgba(240, 185, 11, 0.4); }
    100% { box-shadow: 0 0 30px rgba(240, 185, 11, 0.9); }
  }
  .result-box.losing { opacity: 0.35; filter: grayscale(0.7); }

  /* ===== КНОПКИ ===== */
  .controls {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 600px;
  }
  button {
    padding: 18px 40px;
    font-size: 1.05em;
    font-weight: 800;
    font-family: Georgia, serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 160px;
    touch-action: manipulation;
  }
  #spinBtn {
    background: linear-gradient(180deg, #f0b90b 0%, #b8860b 100%);
    color: #1a1408;
    box-shadow:
      0 4px 0 #7a5a07,
      0 8px 25px rgba(240, 185, 11, 0.5),
      inset 0 2px 0 rgba(255,255,255,0.3);
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  #spinBtn:hover:not(:disabled) { transform: translateY(-2px); }
  #spinBtn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #7a5a07, 0 4px 15px rgba(240, 185, 11, 0.5);
  }
  #spinBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #resetBtn {
    background: linear-gradient(180deg, #2a3550 0%, #1a2338 100%);
    color: #8ba3d0;
    box-shadow: 0 4px 0 #0d1522, inset 0 2px 0 rgba(255,255,255,0.05);
    flex: 0 0 auto;
    min-width: 130px;
  }
  #resetBtn:hover:not(:disabled) { transform: translateY(-2px); background: linear-gradient(180deg, #354565, #232f4a); color: #b0c4e8; }

  /* ===== БАТТЛ РЕЗУЛЬТАТ ===== */
  .battle-result {
    margin-top: 20px;
    font-family: Georgia, serif;
    font-size: 1.8em;
    font-weight: 900;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    min-height: 60px;
    text-shadow: 0 0 30px currentColor;
  }
  .battle-result.show { opacity: 1; transform: scale(1); }

  /* ===== СТАТИСТИКА ===== */
  .stats {
    margin-top: 25px;
    display: flex;
    gap: 25px;
    color: #5a6b8c;
    font-size: 0.85em;
    flex-wrap: wrap;
    justify-content: center;
    background: linear-gradient(180deg, rgba(19, 27, 46, 0.9), rgba(11, 18, 32, 0.9));
    padding: 14px 28px;
    border-radius: 10px;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 600px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stats div span { color: var(--gold); font-weight: 800; font-size: 1.1em; }

  .legend {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.72em;
    color: #5a6b8c;
    max-width: 700px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* ===== ЭФФЕКТЫ ===== */
  .flash-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #fff 0%, rgba(240,185,11,0.8) 50%, transparent 100%);
    z-index: 999; pointer-events: none; opacity: 0;
  }
  .flash-overlay.active { animation: flash 0.8s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  .confetti {
    position: fixed;
    top: -20px;
    width: 8px; height: 16px;
    z-index: 1000;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== МОБИЛЬНАЯ ВЕРСИЯ ===== */
  @media (max-width: 768px) {
    :root {
      --item-w: 105px;
      --roulette-h: 115px;
    }
    h1 { font-size: 1.4em; letter-spacing: 1px; }
    .cases-row { gap: 30px; margin: 10px 0 15px; min-height: 100px; }
    .case { width: 85px; height: 85px; }
    .case.opening .case-lid { transform: translateY(-60px) rotateX(-120deg); }
    .battle-arena { flex-direction: column; gap: 10px; }
    .player-side { width: 100%; padding: 10px; }
    .vs-badge { margin: 3px 0; font-size: 1.1em; padding: 8px 12px; }
    .item { font-size: 0.62em; padding: 4px; }
    .item .avatar { width: 34px; height: 34px; font-size: 0.95em; }
    .marker { border-left-width: 10px; border-right-width: 10px; border-top-width: 16px; top: -7px; }
    button { padding: 15px 20px; font-size: 0.85em; width: 100%; flex: none; min-width: 0; letter-spacing: 1px; }
    .controls { flex-direction: column; gap: 10px; }
    .result-box .highlight { font-size: 1em; }
    .battle-result { font-size: 1.2em; }
    .stats { gap: 12px; font-size: 0.7em; padding: 10px 15px; }
    .legend { gap: 8px; font-size: 0.62em; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>КМТ - Дежурные</h1>
  <div class="subtitle">⚔ Case Battle ⚔</div>
</div>

<div class="cases-row" id="casesRow">
  <div class="case" id="case1">
    <div class="case-lid"></div>
    <div class="case-body"></div>
    <div class="case-light"></div>
  </div>
  <div class="case" id="case2">
    <div class="case-lid"></div>
    <div class="case-body"></div>
    <div class="case-light"></div>
  </div>
</div>

<div class="battle-arena" id="battleArena">
  <div class="player-side">
    <div class="player-title p1">Игрок 1</div>
    <div class="roulette-wrap">
      <div class="marker" id="marker1"></div>
      <div class="roulette" id="roulette1">
        <div class="roulette-inner" id="inner1"></div>
      </div>
    </div>
    <div class="result-box" id="result1"></div>
  </div>

  <div class="vs-badge">VS</div>

  <div class="player-side">
    <div class="player-title p2">Игрок 2</div>
    <div class="roulette-wrap">
      <div class="marker" id="marker2"></div>
      <div class="roulette" id="roulette2">
        <div class="roulette-inner" id="inner2"></div>
      </div>
    </div>
    <div class="result-box" id="result2"></div>
  </div>
</div>

<div class="battle-result" id="battleResult"></div>

<div class="controls">
  <button id="spinBtn">🎲 Открыть кейсы</button>
  <button id="resetBtn">↻ Сброс</button>
</div>

<div class="stats">
  <div>Открытий: <span id="statOpens">0</span></div>
  <div>Легендарок: <span id="statLegend">0</span></div>
  <div>Побед И1: <span id="statW1">0</span></div>
  <div>Побед И2: <span id="statW2">0</span></div>
</div>

<div class="legend">
  <span><i style="background:#8a99b8"></i>Обычный</span>
  <span><i style="background:#4d9be6"></i>Необычный</span>
  <span><i style="background:#8855ff"></i>Редкий</span>
  <span><i style="background:#e64db8"></i>Эпический</span>
  <span><i style="background:#f0b90b"></i>Легендарный</span>
</div>

<div class="flash-overlay" id="flashOverlay"></div>

<script>
// ===== ДАННЫЕ (23 ФИО) =====
const PEOPLE = [
  { name: "Булин Александр",        rarity: "common",    weight: 30, value: 1 },
  { name: "Высоцкая Жанна",         rarity: "common",    weight: 30, value: 1 },
  { name: "Ганов Артем",            rarity: "common",    weight: 30, value: 1 },
  { name: "Данилов Данил",          rarity: "common",    weight: 30, value: 1 },
  { name: "Доровских Константин",   rarity: "common",    weight: 30, value: 1 },
  { name: "Зобнев Никита",          rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кабаков Илья",           rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Климачев Александр",     rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Колесников Александр",   rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кондратьев Николай",     rarity: "uncommon",  weight: 20, value: 2 },
  { name: "Кузнецов Виталий",       rarity: "rare",      weight: 12, value: 3 },
  { name: "Куксенко Никита",        rarity: "rare",      weight: 12, value: 3 },
  { name: "Мананникова Екатерина",  rarity: "rare",      weight: 12, value: 3 },
  { name: "Николенко Кирилл",       rarity: "rare",      weight: 12, value: 3 },
  { name: "Павленко Владислав",     rarity: "rare",      weight: 12, value: 3 },
  { name: "Путин Артём",            rarity: "epic",      weight: 6,  value: 4 },
  { name: "Попова Снежана",         rarity: "epic",      weight: 6,  value: 4 },
  { name: "Рогова Арина",           rarity: "epic",      weight: 6,  value: 4 },
  { name: "Рыбак Константин",       rarity: "epic",      weight: 6,  value: 4 },
  { name: "Списивцев Роман",        rarity: "epic",      weight: 6,  value: 4 },
  { name: "Терехов Денис",          rarity: "legendary", weight: 3,  value: 5 },
  { name: "Тетёркин Егор",          rarity: "legendary", weight: 3,  value: 5 },
  { name: "Шпаков Марк",            rarity: "legendary", weight: 3,  value: 5 },
  { name: "Щербинин Антон",         rarity: "legendary", weight: 3,  value: 5 },
];

const RARITY_LABEL = {
  common: "Обычный", uncommon: "Необычный", rare: "Редкий",
  epic: "Эпический", legendary: "ЛЕГЕНДАРНЫЙ"
};
const COLOR_MAP = {
  common: "#8a99b8", uncommon: "#4d9be6", rare: "#8855ff",
  epic: "#e64db8", legendary: "#f0b90b"
};

// ===== УТИЛИТЫ =====
function pickWeighted() {
  const total = PEOPLE.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of PEOPLE) {
    if (r < p.weight) return p;
    r -= p.weight;
  }
  return PEOPLE[0];
}

function initials(name) {
  const parts = name.split(" ");
  return (parts[0]?.[0] || "") + (parts[1]?.[0] || "");
}

function makeItem(person) {
  const el = document.createElement("div");
  el.className = `item rar-${person.rarity}`;
  el.innerHTML = `
    <div class="avatar">${initials(person.name)}</div>
    <div class="name">${person.name}</div>
  `;
  return el;
}

// ===== ЗВУК (Web Audio API) =====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTick(volume = 0.08) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(900 + Math.random() * 300, ctx.currentTime);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.05);
}

function playCaseOpen() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.5);
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.5);
}

function playFanfare() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const notes = [523, 659, 784, 1047]; // C E G C
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + i * 0.12);
    osc.stop(ctx.currentTime + i * 0.12 + 0.4);
  });
}

// Планируем серию тиков с замедлением
function scheduleTicks(duration = 6000) {
  const startTime = performance.now();
  let lastTick = 0;
  function tick() {
    const elapsed = performance.now() - startTime;
    if (elapsed >= duration) return;
    // Интервал увеличивается к концу (замедление)
    const progress = elapsed / duration;
    const interval = 40 + progress * progress * 250;
    if (elapsed - lastTick >= interval) {
      playTick(0.06);
      lastTick = elapsed;
    }
    requestAnimationFrame(tick);
  }
  tick();
}

    conf.className = 'confetti';

    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

  }
